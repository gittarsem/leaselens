services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leaselens-db
    environment:
      POSTGRES_DB: leaselens
      POSTGRES_USER: leaselens
      POSTGRES_PASSWORD: leaselens
    ports:
      - "5433:5432"
    volumes:
      - leaselens_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaselens -d leaselens"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  leaselens_pgdata:
